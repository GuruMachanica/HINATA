name: Release HINATA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-exe:
    name: Build hinata-backend.exe (bundled brain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # VRM model + VRMA animations ride in Git LFS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build React frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Stage bundled engine (llama.cpp Vulkan)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product/engine | Out-Null

          # The current llama.cpp "latest" release can occasionally be source-only.
          # Walk recent releases and select the newest release that actually
          # publishes a Windows x64 Vulkan binary.
          $headers = @{ "User-Agent" = "HINATA-release-workflow" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100" -Headers $headers

          $release = $null
          $asset = $null

          foreach ($candidate in $releases) {
            $candidateAsset = $candidate.assets |
              Where-Object { $_.name -match '^llama-(v[^-]+|b[0-9]+)-bin-win-vulkan-x64\.zip$' } |
              Select-Object -First 1

            if ($candidateAsset) {
              $release = $candidate
              $asset = $candidateAsset
              break
            }
          }

          if (-not $asset) {
            throw "No Windows x64 Vulkan llama.cpp binary found in the latest 100 releases."
          }

          Write-Host "Using llama.cpp release $($release.tag_name): $($asset.name)"

          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile engine.zip

          if ((Get-Item engine.zip).Length -lt 1048576) {
            throw "Downloaded llama.cpp archive is unexpectedly small."
          }

          Expand-Archive engine.zip -DestinationPath engine-tmp

          $server = Get-ChildItem engine-tmp -Recurse -File -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) {
            throw "llama-server.exe not found in $($asset.name)"
          }

          $src = $server.Directory.FullName
          Copy-Item $server.FullName product/engine/ -Force

          # Binary layouts change between llama.cpp releases. Ship every DLL
          # published beside llama-server.exe instead of a brittle allowlist.
          Get-ChildItem $src -File -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName product/engine/ -Force
          }

          if (-not (Test-Path product/engine/llama-server.exe)) {
            throw "llama-server.exe was not staged"
          }

          $dllCount = (Get-ChildItem product/engine -File -Filter "*.dll").Count
          if ($dllCount -eq 0) {
            throw "No llama.cpp DLLs were staged"
          }

          Write-Host "Staged llama-server.exe and $dllCount DLLs."
          Remove-Item engine.zip, engine-tmp -Recurse -Force

      - name: Stage bundled models (download Q4_K_M + mmproj)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product/bundled-models | Out-Null
          Invoke-WebRequest -Uri "${{ env.GGUF_MODEL }}" -OutFile product/bundled-models/hinata-omni-q4km.gguf
          Invoke-WebRequest -Uri "${{ env.GGUF_MMPROJ }}" -OutFile product/bundled-models/hinata-omni-mmproj.gguf
        env:
          GGUF_MODEL: https://huggingface.co/prithivMLmods/Qwen3-VL-2B-Thinking-abliterated-v1-GGUF/resolve/main/Qwen3-VL-2B-Thinking-abliterated-v1.Q4_K_M.gguf
          GGUF_MMPROJ: https://huggingface.co/prithivMLmods/Qwen3-VL-2B-Thinking-abliterated-v1-GGUF/resolve/main/Qwen3-VL-2B-Thinking-abliterated-v1.mmproj-Q8_0.gguf

      - name: Stage slim hermes-agent
        shell: pwsh
        run: |
          # Build slim staging copy: only .py + config files ship in the exe
          robocopy hermes-agent product/hermes-agent-slim /E *.py *.md *.json *.toml /XF test_* *_test.py
          exit 0

      - name: Build exe
        run: python -m PyInstaller product/hinata-backend.spec --noconfirm

      - name: Smoke test (exe boots)
        shell: pwsh
        run: |
          Start-Process -FilePath dist/hinata-backend.exe -PassThru | Out-Null
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 5
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/health -TimeoutSec 5 | Out-Null
              $ok = $true; break
            } catch { }
          }
          if (-not $ok) { throw "exe did not become healthy in 150s" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hinata-backend-windows
          path: dist/hinata-backend.exe

  release:
    name: Attach exe to GitHub Release
    needs: backend-exe
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hinata-backend-windows
          path: .

      - name: Create release and upload exe
        uses: softprops/action-gh-release@v2
        with:
          name: HINATA ${{ github.ref_name }}
          body: |
            HINATA — Human-like Intelligent Nurturing Autonomous Tomodachi Architecture

            **Download:** `hinata-backend.exe` — single-file backend with the full
            brain bundled (hinata-omni Q4_K_M multimodal GGUF + vision projector).

            **Zero dependencies** — the llama.cpp inference engine (Vulkan GPU)
            and the full multimodal model are bundled inside. No Ollama needed.
            Requires only a modern Windows GPU driver. Alt+Shift+H toggles her.
          files: hinata-backend.exe
          draft: false
          prerelease: false
