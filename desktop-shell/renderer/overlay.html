<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HINATA Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
    }
    #stage {
      position: absolute;
      width: 440px; height: 580px;
      bottom: 20px; right: 20px;
    }
    #stage canvas { display: block; }
    #speech-bubble {
      position: absolute;
      left: 50%; top: 40px;
      transform: translateX(-50%) translateY(8px);
      max-width: 380px;
      padding: 10px 14px;
      background: rgba(20, 24, 38, 0.92);
      color: #ffe9f2;
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 14px;
      font: 500 13px/1.45 'Segoe UI', system-ui, sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10;
    }
    #speech-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="speech-bubble"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <script type="module" src="overlay.js"></script>
</body>
</html>
