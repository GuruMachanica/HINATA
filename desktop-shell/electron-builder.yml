# HINATA desktop shell — electron-builder config
appId: com.gurumachanica.hinata
productName: HINATA
copyright: Copyright (c) 2026 Mohammad Huzaifa — Proprietary, all rights reserved

directories:
  output: release
  buildResources: .

files:
  - src/**/*
  - renderer/**/*
  - tray_icon.png
  - package.json

# VRM + VRMA ride along with the shell (also fetched from LFS on CI)
extraResources:
  - from: ../backend-exe/hinata-backend.exe
    to: backend/hinata-backend.exe
  - from: ../shell-bella/models/vrm
    to: models/vrm

# Signing: wire a cert when purchased (task 2 scaffolding — harmless without).
# electron-builder 24 signs automatically once win.certificateFile / env vars
# (CSC_LINK, CSC_KEY_PASSWORD) are present; unsigned until then.
win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HINATA
  artifactName: HINATA-${version}-setup.${ext}

# electron-updater (task 3): releases live on GitHub
publish:
  provider: github
  owner: GuruMachanica
  repo: HINATA
